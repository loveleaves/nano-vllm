name: CI

on:
  push:
    branches:
      - my_nano
      - "phase*"

  pull_request:
    branches:
      - my_nano

jobs:
  unit-tests:
    name: Unit Tests (Python 3.11 / 3.12)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel build

      - name: Install dependencies
        run: |
          pip install torch \
            --index-url https://download.pytorch.org/whl/cpu

          pip install \
            transformers \
            safetensors \
            xxhash \
            numpy \
            tqdm \
            pytest \
            pytest-timeout

      - name: Install nano-vllm
        run: |
          pip install -e .

      - name: Run unit tests
        run: |
          pytest tests/ -m "unit" --timeout=60
